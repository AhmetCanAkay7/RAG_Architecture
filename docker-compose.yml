version: '3.8'
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # HTTP REST API port
      - "6334:6334" # gRPC port
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334 # gRPC'yi devre dışı bırakmak için bu satırı kaldırın veya commentleyin
    volumes:
      - ./qdrant_storage:/qdrant/storage #bendeki : container içindeki
    restart: unless-stopped
